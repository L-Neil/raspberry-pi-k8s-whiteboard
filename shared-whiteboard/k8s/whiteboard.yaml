apiVersion: v1
kind: Namespace
metadata:
  name: whiteboard
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: whiteboard-data
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: whiteboard-local
  local:
    path: /var/lib/shared-whiteboard
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: whiteboard-storage
              operator: In
              values: ["true"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whiteboard-data
  namespace: whiteboard
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: whiteboard-local
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-whiteboard
  namespace: whiteboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shared-whiteboard
  template:
    metadata:
      labels:
        app: shared-whiteboard
    spec:
      nodeSelector:
        whiteboard-storage: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data-directory
          image: shared-whiteboard:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown -R 1000:1000 /app/data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: whiteboard
          image: shared-whiteboard:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: AUTH_MODE
              value: local
            - name: LOCAL_USER_EMAIL
              value: user@example.invalid
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: whiteboard-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shared-whiteboard
  namespace: whiteboard
spec:
  type: NodePort
  selector:
    app: shared-whiteboard
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
