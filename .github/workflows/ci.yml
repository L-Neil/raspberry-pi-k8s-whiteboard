name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared-whiteboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shared-whiteboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit
      - run: docker build -t shared-whiteboard:ci .
